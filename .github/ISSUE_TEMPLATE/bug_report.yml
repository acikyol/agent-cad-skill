name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran and, if possible, a minimal `model.py`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report or error output
      description: Relevant parts of `output/report.json`, `output/render.log` or the traceback.
      render: text
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: Claude Code, Cursor, Codex, …
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15 / Ubuntu 24.04 / Windows 11, Python 3.12
    validations:
      required: true
