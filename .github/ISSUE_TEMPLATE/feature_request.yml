name: Feature request
description: Suggest an improvement or a new check
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What CAD task is hard today?
      description: Describe the part or workflow and where the agent or the checks fall short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
